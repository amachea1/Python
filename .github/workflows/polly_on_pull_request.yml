name: Polly Beta Audio

on:
  pull_request:
    branches:
      - main

jobs:
  synthesize-beta:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Polly

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set Up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: pip install -r requirements.txt

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.POLLY_AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.POLLY_AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.POLLY_AWS_REGION }}

      - name: Generate Beta Audio
        env:
          POLLY_S3_BUCKET_NAME: ${{ secrets.POLLY_S3_BUCKET_NAME }}
          OUTPUT_KEY: polly-audio/beta.mp3
        run: python synthesize.py