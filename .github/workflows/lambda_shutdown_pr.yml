name: Deploy to Beta (Pull Request)

on:
  pull_request:
    branches:
      - main

jobs:
  deploy-beta:
    name: Zip, Upload, and Deploy to Beta
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}
      - name: Zip Lambda function
        run: zip function.zip lambda_function.py

      - name: Upload Lambda zip to S3 (Beta)
        run: |
          aws s3 cp function.zip s3://${{ secrets.S3_BUCKET_BETA }}/${{ secrets.S3_PATH_BETA }}

      - name: Deploy to Beta via CloudFormation
        run: |
          aws cloudformation deploy \
            --stack-name ${{ secrets.CF_STACK_NAME_BETA }} \
            --template-file infrastructure/cloudformation/lambda-ec2-shutdown.yml \
            --capabilities CAPABILITY_NAMED_IAM \
            --parameter-overrides \
              LambdaFunctionName=${{ secrets.LAMBDA_NAME_BETA }} \
              LambdaCodeBucket=${{ secrets.S3_BUCKET_BETA }} \
              LambdaCodeKey=${{ secrets.S3_PATH_BETA }}